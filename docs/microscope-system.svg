<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Conceptual raster-scan acoustic-resolution photoacoustic microscopy system</title><desc id="desc">A Q-switched laser and beam splitter feed a monitor photodiode and a multimode fiber. The scanning head includes mirror, objective, opto-acoustic combiner and ultrasonic receiver. A sample sits inside water. Receiver signals pass through amplification to data acquisition and a computer.</desc>
